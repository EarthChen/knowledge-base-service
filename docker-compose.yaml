services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
    volumes:
      - /Users/earthchen/docker/data/falkordb:/var/lib/falkordb/data
    environment:
      - FALKORDB_ARGS=TIMEOUT 0
      - REDIS_ARGS=--appendonly yes --appendfsync everysec
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
