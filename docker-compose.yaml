services:
  falkordb:
    image: falkordb/falkordb:v4.18.7
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    environment:
      - FALKORDB_ARGS=TIMEOUT 0
      - REDIS_ARGS=--appendonly yes --appendfsync everysec --aof-use-rdb-preamble yes --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 128mb
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kb-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - FALKORDB__HOST=falkordb
      - FALKORDB__PORT=6379
      - GIT__CLONE_BASE_PATH=/app/repos
      - KB_ENV=development
    env_file:
      - .env
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - kb-repos:/app/repos

volumes:
  falkordb-data:
  kb-repos:
